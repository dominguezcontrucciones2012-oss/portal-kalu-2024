<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KALU - Quesos y Embutidos</title>
    <meta name="description" content="Gestión profesional de inventario, ventas y clientes." />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="https://api.dicebear.com/7.x/initials/svg?seed=KN" />
    <script>
      if (window.location.hostname.includes('admin') || (window.location.hostname === 'localhost' && window.location.port === '5174')) {
        document.title = "KALU ADMIN";
        document.write('<link rel="manifest" id="app-manifest" href="/manifest-admin.json" />');
      } else {
        document.title = "KALU - Quesos y Embutidos";
        document.write('<link rel="manifest" id="app-manifest" href="/manifest.json" />');
      }
    </script>
    <!-- Preconexiones para Firebase (reduce 300-500ms en móvil) -->
    <link rel="preconnect" href="https://firestore.googleapis.com" />
    <link rel="preconnect" href="https://firebase.googleapis.com" />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" />
    <link rel="dns-prefetch" href="https://firestore.googleapis.com" />
    
    <!-- Open Graph for WhatsApp & Social Previews -->
    <meta property="og:title" content="KALU - Quesos y Embutidos" />
    <meta property="og:description" content="Catálogo, Pedidos y Portal Oficial de Kalu." />
    <meta property="og:image" content="https://kalu-queso-sanjuam.web.app/298495.png" />
    <meta property="og:url" content="https://kalu-queso-sanjuam.web.app" />
    <meta property="og:type" content="website" />

    <!-- Precargar el logo para que esté listo al instante -->
    <link rel="preload" href="/298495.png" as="image" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPrompt = e;
      });

      // ── Registro del Service Worker con auto-actualización agresiva ──
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js?v=13').then(reg => {

            // Verificar actualizaciones cada 30 segundos
            setInterval(() => reg.update(), 30000);

            // Cuando el SW detecta una actualización: activarla inmediatamente
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              if (!newWorker) return;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed') {
                  // Forzar activación inmediata sin esperar que se cierren pestañas
                  newWorker.postMessage({ type: 'SKIP_WAITING' });
                }
              });
            });

            // Si ya hay un SW esperando activarse (de un deploy anterior), activarlo ya
            if (reg.waiting) {
              reg.waiting.postMessage({ type: 'SKIP_WAITING' });
            }

          }).catch(err => console.warn('SW Error:', err));

          // Cuando el SW nuevo toma control: recargar la página para servir archivos frescos
          let reloading = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!reloading) {
              reloading = true;
              window.location.reload();
            }
          });
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
